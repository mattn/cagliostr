# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install build dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get install -y --no-install-recommends g++-14 libpq-dev
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 20
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 20

    - name: Configure CMake
      env:
        CC: gcc-14
        CXX: g++-14
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Test PostgreSQL
      working-directory: ${{github.workspace}}/build
      env:
        CAGLIOSTR_TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/postgres
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
